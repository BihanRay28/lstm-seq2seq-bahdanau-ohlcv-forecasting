[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ohlcv-forecaster"
version = "0.1.0"
description = "BiLSTM Seq2Seq Bahdanau-attention OHLCV forecasting experiment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "torch>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ohlcv-forecast = "ohlcv_forecaster.cli:main"

[tool.setuptools]
package-dir = {"" = "src_exp1"}

[tool.setuptools.packages.find]
where = ["src_exp1"]

[tool.pytest.ini_options]
pythonpath = ["src_exp1"]
testpaths = ["tests"]
